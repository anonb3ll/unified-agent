<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge — preview</title>
<style>body{margin:0;padding:16px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:12px;}</style>
</head>
<body>
<div id="root"></div>
<script>
var U = window.UnifiedAgent, h = React.createElement;
var App = h('div', {className:'row'},
  h(U.Badge, null, 'Neutral'), h(U.Badge, {variant:'info'}, 'Info'),
  h(U.Badge, {variant:'success', dot:true}, 'Merged'), h(U.Badge, {variant:'warning', dot:true}, 'Held'),
  h(U.Badge, {variant:'danger', dot:true}, 'Red tier'), h(U.Badge, {size:'md'}, 'md'));
ReactDOM.createRoot(document.getElementById('root')).render(App);
</script>
</body>
</html>
