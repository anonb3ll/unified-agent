<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton — preview</title>
<style>body{margin:0;padding:16px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:12px;max-width:28rem;}</style>
</head>
<body>
<div id="root"></div>
<script>
var U = window.UnifiedAgent, h = React.createElement;
var App = h('div',{className:'row'},[h(U.IconButton,{key:1,'aria-label':'Refresh',icon:'↻',variant:'secondary'}),h(U.IconButton,{key:2,'aria-label':'Close',icon:'✕'})]);
ReactDOM.createRoot(document.getElementById('root')).render(App);
</script>
</body>
</html>
