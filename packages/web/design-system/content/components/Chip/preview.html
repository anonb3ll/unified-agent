<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Chip — preview</title>
<style>body{margin:0;padding:16px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:12px;}</style>
</head>
<body>
<div id="root"></div>
<script>
var U = window.UnifiedAgent, h = React.createElement;
function App(){
  var s = React.useState(true), on = s[0], set = s[1];
  var r = React.useState(true), keep = r[0], setKeep = r[1];
  return h('div', {className:'row'},
    h(U.Chip, {pressed:on, onClick:function(){set(!on);}}, 'Doing'),
    h(U.Chip, {count:14}, 'Blocked'),
    h(U.Chip, {size:'sm', count:3}, 'Mine'),
    keep ? h(U.Chip, {onRemove:function(){setKeep(false);}}, 'agent: agent-codex') : null);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
