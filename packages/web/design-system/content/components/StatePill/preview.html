<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatePill — preview</title>
<style>body{margin:0;padding:16px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:12px;}</style>
</head>
<body>
<div id="root"></div>
<script>
var U = window.UnifiedAgent, h = React.createElement;
var K = ['decision','danger','live','warn','ok','unknown'];
var App = h('div', {className:'row'}, K.map(function(k){return h(U.StatePill, {key:k, kind:k});}).concat([h(U.StatePill, {key:'x', kind:'unknown', label:'No receipt'})]));
ReactDOM.createRoot(document.getElementById('root')).render(App);
</script>
</body>
</html>
