<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Region — preview</title>
<style>body{margin:0;padding:16px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:12px;}</style>
</head>
<body>
<div id="root"></div>
<script>
var U = window.UnifiedAgent, h = React.createElement;
var now = Date.now();
function ok(d, age){ return {status:'success', data:d, error:null, dataUpdatedAt: now - age}; }
var fail = {status:'error', data: undefined, error: new Error('agents HTTP 503'), dataUpdatedAt: 0, refetch: function(){}};
var rows = function(){ return h('p', {style:{margin:0,padding:'12px 16px'}}, 'agent-claude · DEMO-107'); };
var App = h('div', {className:'stack'},
  h(U.Region, {title:'Fleet', queries:[ok([1], 3000)], now: now}, rows),
  h(U.Region, {title:'Fleet', queries:[ok([], 3000)], isEmpty: function(){return true;}, emptyText:'No agents registered.', now: now}, rows),
  h(U.Region, {title:'Quota', queries:[fail], now: now}, rows));
ReactDOM.createRoot(document.getElementById('root')).render(App);
</script>
</body>
</html>
