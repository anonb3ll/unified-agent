<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FreshnessStamp — preview</title>
<style>body{margin:0;padding:16px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:12px;}</style>
</head>
<body>
<div id="root"></div>
<script>
var U = window.UnifiedAgent, h = React.createElement;
var now = Date.now();
var App = h('div', {className:'row'},
  h(U.FreshnessStamp, {state:'ready', updatedAt: now - 4000, now: now}),
  h(U.FreshnessStamp, {state:'stale', updatedAt: now - 26*3600000, now: now}),
  h(U.FreshnessStamp, {state:'partial', updatedAt: now, now: now}),
  h(U.FreshnessStamp, {state:'denied', updatedAt: null, now: now}),
  h(U.FreshnessStamp, {state:'unavailable', updatedAt: null, now: now}));
ReactDOM.createRoot(document.getElementById('root')).render(App);
</script>
</body>
</html>
