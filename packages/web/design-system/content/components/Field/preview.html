<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Field — preview</title>
<style>body{margin:0;padding:16px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:12px;max-width:28rem;}</style>

<body>
<div id="root"></div>
<script>
var U = window.UnifiedAgent, h = React.createElement;
