<html lang="en">
<head><meta charset="utf-8"><title>Select — preview</title>

<body>
<div id="root"></div>
<script>
var U = window.UnifiedAgent, h = React.createElement;
var App = h(U.Field,{label:'Priority'},h(U.Select,{defaultValue:'medium',options:[{value:'high',label:'High'},{value:'medium',label:'Medium'},{value:'low',label:'Low'}]}));

</script>
