# Keeps the SHA-pinned actions in .github/workflows/ current (Dependabot
# rewrites both the SHA and its "# vX" comment). It does not read
# .depot/workflows/: copy each bump into the dispatch-only Depot mirror by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Refreshes the Dockerfile's digest-pinned node and python base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
