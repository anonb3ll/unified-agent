# Seams: deliberate upward imports, each with its reason. They are design, not
# debt, and the check keeps them apart from the baseline.

[[seam]]
from = "tool_surface"
to = "server"
why = "server.py is the composition root that registers every governed tool; tool_surface imports it lazily on first use so lower layers never name the MCP adapter."

[[seam]]
from = "events"
to = "run_records"
why = "prune_events deletes old event_log rows, so it must drop the heartbeat-usage rows whose self-pickup claim it just pruned (#940); the import is lazy and runs only inside a prune that removed rows."

[[seam]]
from = "tools.approvals"
to = "run_records"
why = "Linking an approval to the caller's open run uses the same unclaimed-doing lease as run records (#1653), so an expired claim and a stale unclaimed row are classified once; the import is lazy, inside that lookup."

[[seam]]
from = "task_holds"
to = "node_queue"
why = "A subtree hold's cancel stops members' queued or claimed node items through the existing node_queue.cancel (#1747); the import is lazy, inside the cancel fan-out, while node_queue calls task_holds.claim_block at module level."

[[seam]]
from = "team_spec"
to = "node_queue"
why = "The default seat launcher enqueues a governed ACP item on the ua-node queue (#1736, the #1329 launch path); the import is lazy, inside NodeSeatLauncher, and tests inject a launcher instead."

[[seam]]
from = "team_snapshot"
to = "node_queue"
why = "Team restore reopens or re-dispatches each seat through the existing approval-gated node queue (#1738), never a new path; the import is lazy, inside restore/preview."

[[seam]]
from = "team_snapshot"
to = "node_resume"
why = "Team snapshot and restore read each seat's resume capability and reopen sessions through node_resume (#1738), so resume rules live in one place; the import is lazy."

[[seam]]
from = "tools.graph"
to = "github_app_worker"
why = "coordination_manage's approval_ledger_rerequest (#1854) asks the Approval Ledger worker to open one missed PR-head row through its own poll path, lock and service identity, never a second path; the import is lazy, inside the action."

[[seam]]
from = "tools.graph"
to = "node_command"
why = "coordination_manage exposes supervised node commands (#2413: start, status, adopt) through the canonical node_command runtime, which owns the fence, outbox and adoption rules; the actions are thin wrappers, never a second queue path."

[[seam]]
from = "tools.graph"
to = "node_acceptance"
why = "coordination_manage exposes enrolled-device diagnostics and operator attestation through the canonical node acceptance runtime (#2112); it imports the registered actions lazily instead of duplicating queue or authority logic."

[[seam]]
from = "review_head_status"
to = "shipping_preflight_cli"
why = "The review-head rule lives in one place, beside its tests, in shipping_preflight_cli (#2259): the poll's required check asks that gate through its strict review_head_check entry point (#2320) instead of holding a second copy of the rule; the import is lazy, inside the one call."

[[seam]]
from = "post_init"
to = "github_app_fastpath"
why = "A human decision on an Approval Ledger row hands that head to the ledger worker's own per-PR poll step at once (#2234), so GitHub shows the final status without waiting for the next poll. The approval gate no longer imports the fast path (#2450): post_init.register_kernel_handlers loads it lazily in every entry point that registers the default hooks, and it registers itself with tools.approvals, which calls it after the resolution commits, only for github_app.process_pr_event rows."

[[seam]]
from = "tools.approvals"
to = "approval_slack"
why = "A committed approval request or decision is handed to the optional Slack card notifier (#2303), beside the signed webhook; the import is lazy, after the row commits, the call only enqueues for its own worker, and nothing it posts can resolve an approval."

[[seam]]
from = "work_proposals"
to = "tools.tasks"
why = "Approving a work-proposal item spawns its task through the real task_add (#2393), so task validation, lanes, idempotency and untrusted propagation live in one place; the import is lazy, inside _spawn_task, after the approving claim commits."

[[seam]]
from = "approval_receipts"
to = "messaging.send"
why = "A committed approval receipt is handed to the requesting agent as one hub inform from the in-process service sender hub-approvals (#2435); the import is lazy, inside the notify call after the receipt event commits, and the message carries ids and the decision only."
