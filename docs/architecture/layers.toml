# Layer map for src/unified_agent. Checked by scripts/check_layers.py; the
# rationale and current numbers are in layers.md next to this file.
#
# Layers are listed top first. A module may import from its own layer or any
# layer below it, never above. Modules are placed by exact name (relative to
# the package) or by glob; an exact name wins over a glob, and a module that
# two globs claim must be listed by exact name. Every module must be placed.
#
# Placement is by role, not by directory. A module that sits in the wrong
# directory for its role (tools/approvals.py is a core gate, not an MCP tool
# wrapper) is placed by role and marked "misplaced" so a later move can fix the
# path without redrawing the map.

package = "unified_agent"
source = "../../src"
baseline = "layers-baseline.txt"

