# Component map for src/unified_agent. Checked by scripts/check_components.py;
# the rule, the numbers and the reasons for by-role placements are in
# components.md next to this file. Spec: kernel-split-spec.md (K1, #2439).
#
# Every module belongs to exactly one component (exact name or glob; an exact
# name wins over a glob). A module may import its own component and anything
# in the transitive depends_on of its component. kernel depends on nothing;
# mcp-adapter is the composition root and nothing depends on it. Imports that
# break the rule today are listed in components-baseline.txt, which only
# shrinks.

package = "unified_agent"
source = "../../src"
baseline = "components-baseline.txt"

