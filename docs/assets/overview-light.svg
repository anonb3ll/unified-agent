<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">unified-agent: a meta harness for agents, devices, and people</title>
  <desc id="d">Humans approve and decide through the Control Center. Agents in any harness on any device connect to one hub through MCP, HTTP, CLI, or the SDK. The hub holds authority (identity, profiles, policy, approvals, autonomy modes), shared work (tasks, plans, delegations, runs, memory), and a hash-chained evidence ledger. Executors, device nodes, worktrees, and connectors carry out approved work.</desc>
