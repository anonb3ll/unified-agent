<style>
  #ua-overhaul { color-scheme: dark; --u-bg: light-dark(#f7f8fa,#11111b); --u-panel: light-dark(#ffffff,#181825); --u-rail: light-dark(#eef1f5,#11111b); --u-text: light-dark(#1b2638,#cdd6f4); --u-muted: light-dark(#58667b,#bac2de); --u-line: light-dark(#e1e6ee,#313244); --u-soft: light-dark(#f0f3f8,#313244); --u-accent: light-dark(#3153cb,#f38ba8); --u-link: light-dark(#3153cb,#89b4fa); --u-info: light-dark(#24686a,#94e2d5); --u-selected: light-dark(#e1e8fb,#45475a); --u-good: light-dark(#226448,#a6e3a1); --u-warn: light-dark(#83540b,#f9e2af); --u-bad: light-dark(#a13143,#f38ba8); --u-button: light-dark(#2f4ba0,#f38ba8); --u-button-text: light-dark(#ffffff,#11111b); background:var(--u-bg); color:var(--u-text); font:14px/1.5 system-ui,sans-serif; border-radius:12px; overflow:hidden; }

  #ua-overhaul .accent-art { position:absolute; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(ellipse at 90% 30%,color-mix(in srgb,var(--u-accent) 35%,transparent),transparent 65%),radial-gradient(ellipse at 55% 100%,color-mix(in srgb,var(--u-magenta) 22%,transparent),transparent 70%); }

  #ua-overhaul .overview-intro p:last-child { margin-bottom:0; }

  #ua-overhaul .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:20px; }

  #ua-overhaul .panel { background:var(--u-panel); border:1px solid var(--u-line); border-radius:9px; margin-bottom:14px; }
  #ua-overhaul .panelhead { padding:14px 16px; border-bottom:1px solid var(--u-line); }

  #ua-overhaul .bar { height:100%; background:var(--u-link); }
  #ua-overhaul .message { padding:13px; margin:8px 0; background:var(--u-soft); border-radius:8px; }
  #ua-overhaul .message p { margin:5px 0 0; }
  #ua-overhaul input, #ua-overhaul textarea, #ua-overhaul select { width:100%; color:var(--u-text); background:var(--u-bg); border:1px solid var(--u-line); border-radius:6px; padding:9px; }
  #ua-overhaul label { display:block; margin-bottom:12px; }
  #ua-overhaul label > span { display:block; margin-bottom:5px; font-weight:600; }
  #ua-overhaul dialog { width:min(580px,calc(100% - 24px)); max-height:85dvh; overflow:auto; padding:0; border:1px solid var(--u-line); border-radius:12px; color:var(--u-text); background:var(--u-panel); }
  #ua-overhaul dialog::backdrop { background:rgb(12 19 31 / .55); }
  #ua-overhaul .dialogtitle { padding:16px 20px; border-bottom:1px solid var(--u-line); }
  #ua-overhaul .dialogbody { padding:20px; }
  #ua-overhaul .footer { padding:11px 20px; border-top:1px solid var(--u-line); font-size:11px; color:var(--u-muted); }

  @media(max-width:390px) { #ua-overhaul .stats { grid-template-columns:1fr; } #ua-overhaul .pipeline { grid-template-columns:1fr 1fr; } #ua-overhaul dl { grid-template-columns:1fr; gap:3px; } #ua-overhaul dd { margin-bottom:7px; } }
  @media(pointer:coarse) { #ua-overhaul button { min-height:44px; } #ua-overhaul input,#ua-overhaul select,#ua-overhaul textarea { font-size:16px; } }

<div id="ua-overhaul" aria-label="Unified Agent redesign prototype">
  <div class="workspace">
    <aside>
      <div class="sidebar-brand row"><span class="logo" aria-hidden="true">u</span><span class="brand">Unified Agent</span></div>
      <div class="workspace-name"><strong>Product team</strong><span class="small muted">All projects · 3 agents</span></div>
      <p class="eyebrow navlabel">Workspace</p>
      <nav aria-label="Main navigation">
        <button data-view="overview" aria-current="page"><span class="nav-mark" aria-hidden="true">O</span>Overview</button>
        <button data-view="delivery"><span class="nav-mark" aria-hidden="true">D</span>Delivery</button>
        <button data-view="organization"><span class="nav-mark" aria-hidden="true">T</span>Organization</button>
        <button data-view="knowledge"><span class="nav-mark" aria-hidden="true">K</span>Knowledge</button>
        <button data-view="analytics"><span class="nav-mark" aria-hidden="true">A</span>Analytics</button>
      </nav>
      <div class="divider"></div>
      <nav aria-label="Always available">
        <button data-view="decisions">Decisions <span class="badge warn">1</span></button>
        <button data-view="messages">Messages <span class="badge">1</span></button>
        <button data-view="audit">Audit trail</button>
      </nav>
      <div class="divider"></div>
      <div class="scope small muted">Workspace policy active<br>2 executors available</div>
      <div class="sidebar-account row"><span class="avatar" aria-hidden="true">A</span><div>Operator<br><span class="small muted">Operator</span></div></div>
    </aside>
    <div class="appbody">
    <header class="top row between">
      <div class="row"><span class="section-crumb" id="ua-breadcrumb">Overview</span><span class="sample">Prototype · sample data</span></div>
      <div class="row"><button class="quiet" data-action="search">Search<span class="searchkey" aria-hidden="true">⌘ K</span></button><button class="quiet" data-action="theme" aria-label="Switch appearance">◐</button><button class="primary" data-action="dispatch">Dispatch work ↗</button></div>
    </header>
    <main id="ua-content" aria-label="Overview"></main>
    <footer class="footer row between"><span>Prototype · fictional sample records · no hub connection</span><span>One workspace, from one agent to a team</span></footer>
    </div>
  </div>
  <dialog id="ua-dialog" aria-labelledby="ua-dialog-title"><div class="dialogtitle row between"><h2 id="ua-dialog-title"></h2><button class="quiet" data-action="close">Close</button></div><div class="dialogbody" id="ua-dialog-body"></div></dialog>
  <span id="ua-announcement" class="sr" aria-live="polite"></span>
</div>
<script>
(() => {
  const root = document.getElementById('ua-overhaul');
  const content = root.querySelector('#ua-content');
  const dialog = root.querySelector('#ua-dialog');
  const modalBody = root.querySelector('#ua-dialog-body');
  const notice = root.querySelector('#ua-announcement');
  const state = { view:'overview', tab:'work', knowledge:'memory', density:'comfortable', facet:'Summary', motion:true };
  const titles = { overview:'Overview', delivery:'Delivery', organization:'Organization', knowledge:'Knowledge', analytics:'Analytics', decisions:'Decisions', messages:'Messages', audit:'Audit trail' };
  const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const action = (label,name,primary=false) => `<button class="${primary?'primary':''}" data-action="${name}">${label}</button>`;
  const badge = (text,tone='') => `<span class="badge ${tone}">${text}</span>`;
  const intro = (title,desc) => `<div class="intro"><p class="eyebrow">Product team / all projects</p><h1>${title}</h1><p class="muted">${desc}</p></div>`;
  const overviewIntro = () => `<div class="intro overview-intro"><div class="accent-art" aria-hidden="true" data-shader-state="static"><canvas id="ua-accent-canvas" style="width:100%;height:100%"></canvas></div><div class="row between"><p class="eyebrow">Product team / all projects</p><button class="quiet motion-button" data-action="motion" aria-pressed="false">Motion unavailable</button></div><h1>A clear view of the work.</h1><p class="muted">Decisions first. Progress and proof close behind.</p></div>`;
  const panel = (title,body,extra='') => `<section class="panel"><div class="panelhead row between"><h2>${title}</h2>${extra}</div>${body}</section>`;
  const item = (title,meta,button) => `<div class="item"><div><strong>${title}</strong><div class="small muted">${meta}</div></div>${button}</div>`;
  const stats = entries => `<div class="stats">${entries.map(([label,value,meta])=>`<div class="stat"><span class="small muted">${label}</span><strong>${value}</strong><span class="small muted">${meta}</span></div>`).join('')}</div>`;
  const checks = entries => `<ul class="checks">${entries.map(([status,text,tone])=>`<li><span class="${tone||'good'}">${status}</span> &nbsp; ${text}</li>`).join('')}</ul>`;
  function open(title,body) { root.querySelector('#ua-dialog-title').textContent=title; modalBody.innerHTML=body; if(!dialog.open) dialog.showModal(); }
  function announce(text) { notice.textContent=text; }
  function remember() { if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{section:state.view},privateContent:{...state}}).catch(()=>{}); }
  // One decorative effect. The UI stays complete while the optional CDN module loads.
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  let accentInstance=null, accentEpoch=0, accentModule=null, accentFailure=null;
  let accentIntersection=null, accentResize=null, accentVisible=true;
  function accentHost() { return content.querySelector('.accent-art'); }
  function updateMotionButton() {
    const button=content.querySelector('[data-action="motion"]'); if(!button) return;
    const supported=isSecureContext&&!!navigator.gpu;
    button.disabled=motionPreference.matches||!supported||!!accentFailure;
    button.textContent=motionPreference.matches?'Reduced motion':!supported||accentFailure?'Static accent':state.motion?'Pause motion':'Enable motion';
    button.setAttribute('aria-pressed',String(state.motion&&!button.disabled));
  }
  function stopAccent() {
    accentEpoch++;
    accentIntersection?.disconnect(); accentIntersection=null;
    accentResize?.disconnect(); accentResize=null;
    accentInstance?.destroy(); accentInstance=null;
    const host=accentHost(); if(host) host.dataset.shaderState='static';
  }
  function syncAccentVisibility() {
    if(!accentInstance) return;
    if(document.hidden||!accentVisible) accentInstance.pause(); else accentInstance.resume();
  }
  async function startAccent() {
    updateMotionButton();
    const host=accentHost(), canvas=host?.querySelector('canvas');
    if(!canvas||!state.motion||motionPreference.matches||!isSecureContext||!navigator.gpu||accentFailure||document.hidden) return;
    const epoch=++accentEpoch;
    const current=()=>epoch===accentEpoch&&canvas.isConnected&&state.motion&&!motionPreference.matches;
    try {
      accentModule??=import('https://cdn.jsdelivr.net/npm/shaders@4.0.0/dist/js/bundle.js');
      const {createShader}=await accentModule;
      if(!current()) return;
      // Resolve the light/dark tokens through actual rendered colors, not raw light-dark().
      const resolveColor=token=>{const probe=document.createElement('span');probe.style.color=`var(${token})`;probe.hidden=true;root.append(probe);const value=getComputedStyle(probe).color;probe.remove();const rgb=value.match(/\d+/g).slice(0,3);return '#'+rgb.map(channel=>Number(channel).toString(16).padStart(2,'0')).join('');};
      const instance=await createShader(canvas,{components:[{type:'FlowingGradient',id:'mocha-flow',props:{colorA:resolveColor('--u-bg'),colorB:resolveColor('--u-accent'),colorC:resolveColor('--u-magenta'),colorD:resolveColor('--u-panel'),speed:.15,distortion:.18,seed:7,colorSpace:'linear'}}]}, {
        disableTelemetry:true,enablePerformanceTracking:false,observeElement:false,
        onReady:()=>{if(current()) host.dataset.shaderState='ready';},
        // Dispose even recoverable errors: a static fallback must not hide a live GPU loop.
        onError:()=>{if(current()){host.dataset.shaderState='static';queueMicrotask(()=>{if(!current()) return;accentFailure=accentInstance?.getFailureReason()||'device-error';stopAccent();updateMotionButton();});}}
      });
      if(!current()) {instance.destroy();return;}
      if(instance.getFailureReason()) {accentFailure=instance.getFailureReason();host.dataset.shaderState='static';instance.destroy();updateMotionButton();return;}
      accentInstance=instance;
      accentVisible=true;
      accentIntersection=new IntersectionObserver(entries=>{accentVisible=entries[0].isIntersecting;syncAccentVisibility();});
      accentIntersection.observe(canvas);
      accentResize=new ResizeObserver(()=>accentInstance?.resize());accentResize.observe(canvas);
      syncAccentVisibility();
    } catch {
      if(current()) {host.dataset.shaderState='static';accentFailure='load-or-init-failed';updateMotionButton();}
    }
  }
  motionPreference.addEventListener('change',()=>{stopAccent();startAccent();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden) syncAccentVisibility();else if(accentInstance) syncAccentVisibility();else startAccent();});
  window.addEventListener('pagehide',stopAccent);
  window.addEventListener('pageshow',event=>{if(event.persisted) startAccent();});
  function render() {
    stopAccent();
    content.setAttribute('aria-label',titles[state.view]);
    root.querySelector('#ua-breadcrumb').textContent=titles[state.view];
    root.querySelectorAll('[data-view]').forEach(button=>{ if(button.dataset.view===state.view) button.setAttribute('aria-current','page'); else button.removeAttribute('aria-current'); });
    content.innerHTML = sectionTabs() + (state.facet==='Summary' ? views[state.view]() : facetView());
    root.style.setProperty('--u-density',state.density);
    startAccent();
  }

  // Coverage catalogue: legacy destinations and nested surfaces, deliberately sample-only.
  const features = [{"id":"home","label":"Home","view":"overview","facet":"Summary","description":"Prioritized decisions, blockers, progress and current operational signals."},{"id":"attention","label":"Attention","view":"overview","facet":"Attention","description":"Consequences, owners, age and next action for each exception."},{"id":"tasks","label":"Tasks","view":"delivery","facet":"Tasks","description":"Queue, ownership, due dates, comments and linked delivery context."},{"id":"board","label":"Board","view":"delivery","facet":"Tasks","description":"Alternate status view over the same task records."},{"id":"goals","label":"Goals","view":"delivery","facet":"Planning","description":"Objectives and the reason each task exists."},{"id":"plans","label":"Plans","view":"delivery","facet":"Planning","description":"Steps, ownership, dependencies and plan review checkpoints."},{"id":"canvas","label":"Canvas","view":"delivery","facet":"Planning","description":"A planning canvas linked to work; drawings do not grant authority."},{"id":"work-graph","label":"Work Graph","view":"delivery","facet":"Planning","description":"Goal-to-evidence relationships and ready or blocked work."},{"id":"task-graph","label":"Task Graph","view":"delivery","facet":"Planning","description":"Dependencies and task or plan lineage; alternate work view."},{"id":"cycles","label":"Cycles","view":"delivery","facet":"Runs","description":"Autonomous cycles with scope, progress and intervention history."},{"id":"langgraph","label":"Execution checkpoints","view":"delivery","facet":"Runs","description":"Execution checkpoints for diagnosing a selected run."},{"id":"dispatch_receipts","label":"Delivery receipts","view":"delivery","facet":"Releases","description":"Run delivery summaries, proof gaps and linked release artifacts."},{"id":"org","label":"Teams & ownership","view":"organization","facet":"Teams","description":"Offices, members, owned work and governed team startup."},{"id":"agent-topology","label":"Tea     'reply-preview':()=>{ const value=modalBody.querySelector('#ua-reply').value.trim(); modalBody.querySelector('#ua-reply-result')?.remove(); modalBody.insertAdjacentHTML('beforeend',`<div id="ua-reply-result" role="${value?'status':'alert'}" class="notice">${value?'<strong>Draft preview · not sent</strong><br>To Operator’s conversation with Hermes<br>'+esc(value):'Enter a reply to preview.'}</div>`); },
    'review-thread':()=>open('Search reliability · review conversation','<p class="small muted">DEMO-THREAD-4 → DEMO-104 · no outstanding request</p><div class="message"><strong>Claude · Reviewer</strong><p>Checks pass on demo-a18f. Required approval and deployment remain outstanding.</p></div><div class="message"><strong>Codex · Owner</strong><p>The request is bound to that revision. I will hold release for the designated actor.</p></div>'+action('Inspect linked delivery','work')),
    dispatch:()=>open('Dispatch bounded work','<p class="muted">Choose the work, executor and limits before launch.</p><form id="ua-dispatch-form"><label><span>Task</span><select name="task"><option value="DEMO-108">DEMO-108 · Diagnose stale integration health</option><option value="DEMO-109">DEMO-109 · Investigate missing delivery receipt</option></select></label><label><span>Executor</span><select name="executor"><option>Codex · Available</option><option>Hermes · Available</option></select></label><label><span>Allowed scope</span><input name="scope" value="Read connector status and callback logs; no credential changes" required maxlength="240"></label><div class="twocol"><label><span>Requested time limit (minutes)</span><input name="minutes" type="number" min="1" max="60" value="20" required></label><label><span>Requested spend limit (USD)</span><input name="spend" type="number" min="0.01" max="25" step="0.01" value="2.00" required></label></div><label><span>Expected output</span><input name="output" value="Diagnosis with evidence and a proposed repair" required maxlength="240"></label><button type="submit" class="primary">Inspect preflight</button></form><p class="small muted" style="margin-top:12px">Prototype only. No run is launched. Live preflight must check policy, capacity, claim, budget and approval.</p>'),
    search:()=>open('Find work or a destination','<label><span>Search this prototype</span><input id="ua-search" placeholder="Try audit, memory or search reliability…" autocomplete="off"></label><div id="ua-search-results"></div>')
  };
  const validView=view=>typeof view==='string'&&Object.hasOwn(views,view)&&typeof views[view]==='function';
  function navigate(view,facet='Summary') { if(!validView(view)) return; if(dialog.open) dialog.close(); state.view=view; state.facet=facet; render(); announce(titles[view]+' opened'); remember(); }
  root.addEventListener('click',event=>{ const target=event.target.closest('button'); if(!target) return; if(target.dataset.feature) inspectFeature(target.dataset.feature); else if(target.dataset.facet) {state.facet=target.dataset.facet;render();remember();announce(state.facet+' opened');} else if(target.dataset.view) navigate(target.dataset.view,target.dataset.targetFacet||'Summary'); else if(target.dataset.tab) {const tab=target.dataset.tab;workDetail(tab);modalBody.querySelector(`[data-tab="${tab}"]`)?.focus();remember();} else if(target.dataset.knowledge) {state.knowledge=target.dataset.knowledge;render();remember();} else if(actions[target.dataset.action]) { actions[target.dataset.action](); if(target.dataset.action==='search') updateSearch(''); } });
  root.addEventListener('submit',event=>{ if(event.target.id!=='ua-dispatch-form') return; event.preventDefault(); const data=new FormData(event.target); const scope=String(data.get('scope')).trim(); const output=String(data.get('output')).trim(); modalBody.querySelector('#ua-preflight')?.remove(); if(!scope||!output) {modalBody.insertAdjacentHTML('beforeend','<div id="ua-preflight" class="notice" role="alert">Scope and expected output must contain text.</div>');return;} modalBody.insertAdjacentHTML('beforeend',`<div id="ua-preflight" class="notice" role="status"><strong>Preflight preview · no launch</strong><br>${esc(data.get('task'))} → ${esc(data.get('executor'))}<br>Scope: ${esc(scope)}<br>Requested limits: ${esc(data.get('minutes'))} minutes / $${Number(data.get('spend')).toFixed(2)}<br>Output: ${esc(output)}<br><span class="small">Live claim, permission, capacity, budget and approval checks remain required. Requested limits are not proof of enforcement; show effective policy before launch.</span></div>`); });
  function updateSearch(value) { const options=Object.entries(titles).map(([view,label])=>({view,label})); features.filter(f=>f.view!=='dispatch').forEach(f=>options.push({feature:f.id,label:f.label+' · '+f.facet})); options.push({action:'work',label:'Search reliability · DEMO-104'},{view:'knowledge',label:'Memory & unified tools'}); const matches=options.filter(option=>option.label.toLowerCase().includes(value.toLowerCase())); modalBody.querySelector('#ua-search-results').innerHTML=matches.length ? matches.map(option=>`<div class="item"><button class="link" ${option.feature?'data-feature="'+option.feature+'"':option.view?'data-view="'+option.view+'"':'data-action="'+option.action+'"'}>${esc(option.label)}</button></div>`).join('') : '<p role="status">No matching sample record.</p>'; }
  root.addEventListener('input',event=>{if(event.target.id==='ua-search') updateSearch(event.target.value);});
  document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();actions.search();updateSearch('');}});
  root.addEventListener('change',event=>{if(event.target.matches('#ua-dispatch-form select[name="task"]')) {const form=event.target.form;const receipt=event.target.value==='DEMO-109';form.elements.scope.value=receipt?'Read deployment records and existing evidence; no release changes':'Read connector status and callback logs; no credential changes';form.elements.output.value=receipt?'Evidence gap diagnosis with supported receipt references':'Diagnosis with evidence and a proposed repair';modalBody.querySelector('#ua-preflight')?.remove();}});
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved&&validView(saved.view)) {state.motion=saved.motion!==false;state.view=saved.view;state.facet=validFacet(saved.view,saved.facet)?saved.facet:'Summary';state.knowledge=saved.knowledge==='tools'?'tools':'memory';render();}});
  const saved=window.openai?.widgetState?.privateContent; if(saved&&validView(saved.view)) {state.motion=saved.motion!==false;state.view=saved.view;state.facet=validFacet(saved.view,saved.facet)?saved.facet:'Summary';state.knowledge=saved.knowledge==='tools'?'tools':'memory';}
  render();
  if(globalThis.Tweak) {const tweak=new Tweak({container:root,onChange:()=>{content.style.padding=state.density==='compact'?'16px':'24px';stopAccent();startAccent();}});tweak.addSelect(state,'density',{label:'Content density',options:['comfortable','compact']});tweak.addToggle(state,'motion',{label:'Accent motion'});}
})();
</script>
