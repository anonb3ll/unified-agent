<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>unified-agent Server Stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#1e1e2e; --ink:#cdd6f4; --muted:#a6adc8; --accent:#fab387; }
    body { font-family:'Geist', system-ui, sans-serif; background:var(--paper); color:var(--ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1280px; width:100%; }
    .eyebrow { font-family:'Geist Mono', monospace; font-size:0.66rem; font-weight:500;
      letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin-bottom:0.5rem; }
    h1 { font-family:'Instrument Serif', serif; font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem);
      font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:960px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Diagram Design</p>
    <h1>unified-agent server stack — a request on its way down</h1>

    <svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-title stack-desc">
      <title id="stack-title">unified-agent server stack</title>
      <desc id="stack-desc">Six layers a tool call passes through, top to bottom: client, FastMCP transport with identity binding, the policy and profile gate that wraps every call, the tool modules with their safety resolvers, the SQLite store and event ledger holding the source of truth, and the optional operational planes.</desc>
      <defs>
        <marker id="down" markerWidth="9" markerHeight="8" refX="4.5" refY="7" orient="auto"><polygon points="0 0, 9 0, 4.5 8" fill="#a6adc8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#1e1e2e"/>

      <!-- direction indicator, left margin outside the stack -->
      <text x="44" y="92" fill="#a6adc8" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.1em">a request</text>
      <line x1="84" y1="104" x2="84" y2="556" stroke="rgba(205,214,244,0.28)" stroke-width="1" marker-end="url(#down)"/>
      <text x="44" y="580" fill="#7f849c" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.1em">to state</text>

      <!-- bands -->
      <rect x="128" y="76" width="1088" height="504" rx="8" fill="none" stroke="#a6adc8" stroke-width="1"/>
      <line x1="128" y1="148" x2="1216" y2="148" stroke="rgba(205,214,244,0.12)" stroke-width="0.8"/>
      <line x1="128" y1="220" x2="1216" y2="220" stroke="rgba(205,214,244,0.12)" stroke-width="0.8"/>
      <line x1="128" y1="424" x2="1216" y2="424" stroke="rgba(205,214,244,0.12)" stroke-width="0.8"/>
      <line x1="128" y1="508" x2="1216" y2="508" stroke="rgba(205,214,244,0.12)" stroke-width="0.8"/>

      <!-- focal L3 -->
      <rect x="129" y="221" width="1086" height="202" fill="rgba(250,179,135,0.12)"/>
      <rect x="128" y="220" width="1088" height="204" fill="none" stroke="#fab387" stroke-width="1.2"/>

      <!-- L1 -->
      <text x="152" y="118" fill="#7f849c" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L1</text>
      <text x="206" y="114" fill="#cdd6f4" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Client</text>
      <text x="206" y="132" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace">agent host — Claude · Codex · Cursor · Agy — or the web control center</text>
      <text x="1192" y="118" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">MCP · stdio / HTTP</text>

      <!-- L2 -->
      <text x="152" y="190" fill="#7f849c" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L2</text>
      <text x="206" y="186" fill="#cdd6f4" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Transport</text>
      <text x="206" y="204" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace">FastMCP server + HTTP middleware</text>
      <text x="1192" y="190" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">verifies bearer token → binds a verified identity</text>

      <!-- L3 focal -->
      <text x="152" y="250" fill="#fab387" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L3</text>
      <text x="206" y="246" fill="#cdd6f4" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Gate — every tool call passes through the server.py wrapper</text>
      <text x="206" y="278" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace">identity gate — binds an HTTP request to a verified agent</text>
      <text x="206" y="300" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace">policy gate — holds selected calls for a one-time approval</text>
      <text x="206" y="322" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace">profile gate — capability overlay keyed by agent + MCP session id</text>
      <text x="206" y="354" fill="#7f849c" font-size="10" font-family="'Geist Mono', monospace">developer · steward · chief-of-staff · operator · research</text>
      <text x="206" y="376" fill="#7f849c" font-size="10" font-family="'Geist Mono', monospace">performance instrumentation · monitoring · telemetry spans</text>
      <text x="1192" y="250" fill="#fab387" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">one code path for MCP + web dispatch</text>
      <text x="1192" y="376" fill="#7f849c" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">profile exposure: authenticated HTTP sessions only</text>

      <!-- L4 -->
      <text x="152" y="462" fill="#7f849c" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L4</text>
      <text x="206" y="458" fill="#cdd6f4" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Tool modules + safety resolvers</text>
      <text x="206" y="480" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace">~128 tools: memory · tasks · plans · fs · git · vault · web · audit · dispatch</text>
      <text x="1192" y="452" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">path resolver — rejects paths outside the root</text>
      <text x="1192" y="472" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">command vetter — allowlisted programs only</text>

      <!-- L5 -->
      <text x="152" y="546" fill="#7f849c" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L5</text>
      <text x="206" y="542" fill="#cdd6f4" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Durable state</text>
      <text x="206" y="560" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace">SQLite storage + event ledger — memory · tasks · plans · approvals · events</text>
      <text x="1192" y="546" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">WAL + FTS · relational data is the source of truth</text>

      <!-- L6 outside the stack -->
      <rect x="128" y="604" width="1088" height="32" rx="6" fill="#262636" stroke="rgba(205,214,244,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="152" y="624" fill="#7f849c" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.1em">L6 · OPTIONAL</text>
      <text x="1192" y="624" fill="#a6adc8" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">vault · executor · event bus · web control center · telemetry projection · LangGraph plane</text>
    </svg>
  </div>
</body>
</html>
